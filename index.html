<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&family=Manrope:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">

<style>
/* ── tokens ─────────────────────────────────────────────── */
/* "Citrus Sunrise" — Lokesh's pick of 3 colorful drafts previewed live
   (Phase H). Learning keeps its own green accent as the section indicator;
   Life OS's is this warm orange. Variable names are unchanged from the
   previous palette so nothing else below (or in week.js/month.js) needs
   editing, only values. Dark mode's --surface/--line are pulled further
   from --ground than a straight rescale would give, specifically because
   the first draft's dark cards were flagged as blending into the
   background — inputs/cards need a visible step up, not just a hue swap. */
:root{
  --ground:#FFF8ED; --surface:#FFFFFF; --raised:#FCF1DE; --sunk:#FBEDD2;
  --ink:#2E2013; --ink-2:#6B5A3D; --muted:#A5906D;
  --line:#F1DFB8; --line-2:#E4C88C;
  --accent:#FF6B35; --accent-soft:#FFE3D4; --on-accent:#FFFFFF;
  --d1:#E8551F; --head:#C2410C; --good:#2BB673; --stop:#E63946;
  --good-soft:#DCF3E6; --stop-soft:#FBDEE0;
  --mark:#FFD666; --mark-ink:#3A2400;
  --shadow:0 1px 2px rgba(46,32,19,.08), 0 1px 8px rgba(46,32,19,.05);
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#1F1409; --surface:#332212; --raised:#3D2A16; --sunk:#190F07;
    --ink:#FBEEDA; --ink-2:#D9C2A0; --muted:#9C8A6C;
    --line:#4A3A22; --line-2:#5E4A2A;
    --accent:#FF7F52; --accent-soft:#3D2415; --on-accent:#1F1409;
    --d1:#F0793D; --head:#FF8A5C; --good:#4FC98B; --stop:#F1786B;
    --mark:#B8860B; --mark-ink:#2A1D06;
    --good-soft:#1C3B2A; --stop-soft:#3E1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --ground:#1F1409; --surface:#332212; --raised:#3D2A16; --sunk:#190F07;
  --ink:#FBEEDA; --ink-2:#D9C2A0; --muted:#9C8A6C;
  --line:#4A3A22; --line-2:#5E4A2A;
  --accent:#FF7F52; --accent-soft:#3D2415; --on-accent:#1F1409;
  --d1:#F0793D; --head:#FF8A5C; --good:#4FC98B; --stop:#F1786B;
  --mark:#B8860B; --mark-ink:#2A1D06;
  --good-soft:#1C3B2A; --stop-soft:#3E1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}

*{box-sizing:border-box}
body{
  background:var(--ground); color:var(--ink); margin:0;
  font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
.serif{font-family:"Literata",Georgia,serif; font-weight:400}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}

/* ── shell ──────────────────────────────────────────────── */
.wrap{max-width:820px;margin:0 auto;padding:20px 18px 120px}
.wrap.wide{max-width:1000px}

header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.brand{font-family:"Manrope",sans-serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.spring{flex:1}

.seg{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{
  font:inherit;font-size:13px;font-weight:500;border:0;background:none;color:var(--muted);
  padding:5px 15px;border-radius:999px;cursor:pointer;transition:color .12s,background .12s;
}
.seg button[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg button:hover:not([aria-current="true"]){color:var(--ink-2)}
.seg button:focus-visible,.iconbtn:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.iconbtn{
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:14px;line-height:1;
  display:inline-flex;align-items:center;justify-content:center;
}
.iconbtn:hover{border-color:var(--line-2);color:var(--ink)}
.iconbtn[disabled]{opacity:.35;cursor:default}

/* ── date head ──────────────────────────────────────────── */
.datehead{display:flex;align-items:flex-end;gap:14px;margin-bottom:26px;flex-wrap:wrap}
.datehead h1{
  font-family:"Literata",Georgia,serif;font-weight:400;
  font-size:clamp(30px,6vw,42px);line-height:1;margin:0;letter-spacing:-.01em;
}
.datehead .sub{font-family:"Manrope",sans-serif;font-size:11.5px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;padding-bottom:4px}
.nav-day{display:flex;gap:6px;align-items:center;padding-bottom:2px}

/* ── sections ───────────────────────────────────────────── */
section.blk{border-top:1px solid var(--line);padding-top:18px;margin-top:26px}
.blk > h2,.tlsection > summary h2{
  font-family:"Manrope",sans-serif;font-size:13px;font-weight:800;
  letter-spacing:.12em;text-transform:uppercase;color:var(--head);
  margin:0 0 14px;display:flex;align-items:center;gap:10px;
}
.blk > h2::before,.tlsection > summary h2::before{content:"";width:4px;height:1.1em;border-radius:2px;background:var(--head);flex:none}
.blk > h2 .count,.tlsection > summary h2 .count{color:var(--ink-2);letter-spacing:.02em;font-weight:600}
.blk > h2 .spring{flex:1}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}

/* affirmation */
.affirm{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0 var(--r) var(--r) 0;padding:18px 22px}
.affirm p{margin:0;font-family:"Literata",Georgia,serif;font-size:20px;line-height:1.45;color:var(--ink)}
.anchor{display:flex;gap:10px;align-items:baseline;margin-top:14px;font-size:14.5px;color:var(--ink-2)}
.anchor b{font-family:"Manrope",sans-serif;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap;font-weight:600}

/* ── task rows ──────────────────────────────────────────── */
.tasks{display:flex;flex-direction:column;gap:2px}
.taskrow{display:flex;gap:6px;align-items:stretch}
.taskrow .task{flex:1;width:auto}
.taskrow .rm{flex:none;border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;padding:0 6px}
.taskrow .rm:hover{color:var(--stop)}
.task{
  display:flex;gap:12px;align-items:flex-start;padding:11px 12px;border-radius:8px;
  background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:left;
  font:inherit;color:var(--ink);width:100%;transition:border-color .12s;
}
.task:hover{border-color:var(--line-2)}
.task .box{
  width:17px;height:17px;border-radius:5px;border:1.5px solid var(--line-2);flex:none;margin-top:2px;
  display:flex;align-items:center;justify-content:center;font-size:11px;line-height:1;color:var(--on-accent);
}
.task[data-s="in_progress"] .box{border-color:var(--accent);background:none;position:relative}
.task[data-s="in_progress"] .box::after{content:"";width:7px;height:7px;border-radius:2px;background:var(--accent)}
.task[data-s="done"] .box{border-color:var(--good);background:var(--good)}
.task[data-s="carried_forward"] .box{border-color:var(--muted)}
.task[data-s="carried_forward"] .box::after{content:"›";color:var(--muted);font-size:14px;font-weight:700}
.task .body{flex:1;min-width:0}
.task .t{display:block;word-break:break-word}
.task[data-s="done"] .t{color:var(--ink-2);text-decoration:line-through}
.task .meta{font-family:"Manrope",sans-serif;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:3px;display:block}

/* ── six-rail: the app's motif ──────────────────────────── */
.rail{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.step{
  border:1px solid var(--line);background:var(--surface);border-radius:8px;
  padding:9px 6px 8px;cursor:pointer;font:inherit;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:6px;transition:all .12s;
}
.step:hover{border-color:var(--line-2)}
.step .dot{width:7px;height:7px;border-radius:50%;background:var(--line-2);transition:background .12s,box-shadow .12s}
.step .lb{font-size:10.5px;line-height:1.2;text-align:center;font-weight:500}
.step[aria-pressed="true"]{border-color:var(--good);background:var(--good-soft);color:var(--ink)}
.step[aria-pressed="true"] .dot{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 22%,transparent)}
@media (max-width:520px){.rail{grid-template-columns:repeat(3,1fr)}}
.rail.rail4{grid-template-columns:repeat(4,1fr)}
@media (max-width:420px){.rail.rail4{grid-template-columns:repeat(2,1fr)}}

/* ── notes / journal ────────────────────────────────────── */
.notes{display:flex;flex-direction:column;gap:1px;margin-bottom:12px}
.note{display:flex;gap:12px;padding:9px 2px;border-bottom:1px solid var(--line)}
.note:last-child{border-bottom:0}
.note .notetime-edit{font-family:"Manrope",sans-serif;font-size:11px;color:var(--muted);flex:none;width:92px;padding:2px 4px;border:1px solid transparent;background:none;border-radius:5px}
.note .notetime-edit:hover,.note .notetime-edit:focus{border-color:var(--line);background:var(--surface);color:var(--ink)}
.note .txt{flex:1;white-space:pre-wrap;word-break:break-word;font-size:14.5px}
.note.insight .txt{border-left:2px solid var(--accent);padding-left:10px}
.note .del{opacity:0;border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;padding:0 4px;line-height:1}
.note:hover .del,.note .del:focus-visible{opacity:1}

.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1}
.composer input[type=time]{flex:none;width:100px}
textarea,input[type=text],input[type=number],input[type=password],input[type=time],input[type=date],input[type=url],select{
  font:inherit;width:100%;background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:8px;padding:9px 11px;resize:vertical;
}
textarea::placeholder,input::placeholder{color:var(--muted)}
textarea:focus,input:focus,select:focus{border-color:var(--accent)}
label.fld{display:block;margin-bottom:14px}
label.fld > span{
  display:block;font-family:"Manrope",sans-serif;font-size:10px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;
}

/* ── buttons ────────────────────────────────────────────── */
.btn{
  font:inherit;font-size:14px;font-weight:500;border-radius:9px;padding:9px 18px;cursor:pointer;
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink);transition:all .12s;
}
.btn:hover{border-color:var(--ink-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.45;cursor:default;filter:none}
.btn.sm{font-size:13px;padding:6px 13px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}

/* ── stats ──────────────────────────────────────────────── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat .k{font-family:"Manrope",sans-serif;font-size:9.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:"Literata",Georgia,serif;font-size:31px;line-height:1.1;margin-top:5px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:15px;color:var(--muted)}

/* hph rows */
.hphlist{display:flex;flex-direction:column;gap:9px}
.hphrow{display:grid;grid-template-columns:96px 1fr 34px;gap:12px;align-items:center}
.hphrow .nm{font-size:13px;color:var(--ink-2)}
.hphrow .num{font-family:"Manrope",sans-serif;font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.hphrow input[type=range]{width:100%;accent-color:var(--accent)}

/* ── week view: progress + category plan ───────────────────── */
.tag{font-family:"Manrope",sans-serif;font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border-radius:5px;line-height:1.6;background:var(--raised);color:var(--muted)}
.tag.new{background:var(--accent-soft);color:var(--accent)}
.tag.moved{background:var(--sunk);color:var(--ink-2)}

.progressband{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px;box-shadow:var(--shadow)}
.progressband .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.progressband .num{font-family:"Literata",Georgia,serif;font-size:26px}
.progressband .lbl{font-family:"Manrope",sans-serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.progressband .track{height:8px;background:var(--sunk);border-radius:5px;overflow:hidden;display:flex}
.progressband .track .seg{height:100%}
.progressband .keyfocus{margin:12px 0 0;font-size:14px;color:var(--ink-2);padding-top:12px;border-top:1px solid var(--line)}
.progressband .keyfocus b{color:var(--muted);font-family:"Manrope",sans-serif;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;display:block;margin-bottom:4px}
.progressband .keyfocus textarea{margin-top:2px}

.pillargroup{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:10px;overflow:hidden}
.pillarhead{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--raised);border-bottom:1px solid var(--line)}
.pillarhead .nm{font-weight:600;font-size:13.5px;flex:1}
.pillarhead .prog{font-family:"Manrope",sans-serif;font-size:10.5px;color:var(--muted)}
.ptask2{display:flex;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line)}
.ptask2:last-of-type{border-bottom:0}
.ptask2 .box{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--line-2);flex:none;cursor:pointer}
.ptask2.done .box{border-color:var(--good);background:var(--good)}
.ptask2 .tk{flex:1;font-size:13.5px}
.ptask2.done .tk{color:var(--muted);text-decoration:line-through}
.ptask2 .daychip{font-family:"Manrope",sans-serif;font-size:9.5px;color:var(--muted);border:1px solid var(--line-2);border-radius:5px;padding:2px 6px;flex:none}
.ptask2 .cf{font-family:"Manrope",sans-serif;font-size:9px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--stop);background:var(--stop-soft);border-radius:5px;padding:2px 6px;flex:none}
.ptask2 .rm{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;flex:none}
.addrow{display:flex;gap:8px;padding:9px 14px;align-items:center}
.addrow input{flex:1;background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font:inherit;font-size:13px;color:var(--ink)}
.addrow select{background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font:inherit;font-size:12px;color:var(--ink-2);flex:none;width:92px}
.addrow button{flex:none;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:7px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}
.frommonth{background:var(--accent-soft);border-top:1px solid var(--line);padding:8px 14px}
.frommonth .lbl{font-family:"Manrope",sans-serif;font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;display:block}
.frommonth .item{display:flex;gap:8px;align-items:center;padding:4px 0;font-size:12.5px;color:var(--ink-2)}
.frommonth .item span{flex:1}
.frommonth .item button{flex:none;border:1px solid var(--accent);background:none;color:var(--accent);border-radius:6px;padding:3px 9px;font:inherit;font-size:11.5px;cursor:pointer}
.frommonth .item button.dismiss-month,.frommonth .item button.dismiss-carry{border:0;color:var(--muted);padding:3px 4px;font-size:15px;line-height:1}
.frommonth .item button.dismiss-month:hover,.frommonth .item button.dismiss-carry:hover{color:var(--stop)}

/* ── month view: plan + progress, intentions by category ───── */
.progressband .fields{margin:12px 0 0;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.progressband .fields label{display:block}
.progressband .fields label b{color:var(--muted);font-family:"Manrope",sans-serif;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;display:block;margin-bottom:4px}
.progressband .rowfields{display:grid;grid-template-columns:1fr 200px;gap:10px}
@media(max-width:520px){.progressband .rowfields{grid-template-columns:1fr}}

.introw{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:7px}
.introw:last-of-type{border-bottom:0}
.introw .top{display:flex;gap:8px;align-items:center}
.introw .txt{flex:1;font-size:13.5px;background:var(--surface);border:1px solid transparent;border-radius:6px;padding:2px 4px}
.introw .txt:focus{border-color:var(--line);outline:none}
.introw.done .txt{color:var(--muted)}
.introw select.status{font-family:"Manrope",sans-serif;font-size:10px;text-transform:uppercase;border:1px solid var(--line-2);border-radius:6px;padding:3px 6px;background:var(--surface);color:var(--ink-2);flex:none;width:112px}
.introw .rm{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;flex:none}
.introw .proggy{display:flex;align-items:center;gap:8px}
.introw .proggy input[type=range]{flex:1;accent-color:var(--accent)}
.introw .proggy .pct{font-family:"Manrope",sans-serif;font-size:10.5px;color:var(--muted);width:34px;text-align:right}

.kdrow{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.kdrow:first-of-type{border-top:0}
.kdrow .date{font-family:"Manrope",sans-serif;font-size:11.5px;color:var(--muted);flex:none;width:60px}
.kdrow .ev{flex:1;font-size:13.5px;background:var(--surface);border:1px solid transparent;border-radius:6px;padding:2px 4px}
.kdrow .ev:focus{border-color:var(--line);outline:none}
.kdrow .rm{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;flex:none}
.kdaddrow{display:flex;gap:8px;padding-top:10px}
.kdaddrow input[type=date]{flex:none;width:132px}
.kdaddrow input[type=text]{flex:1}
.kdaddrow button{flex:none;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:7px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}

/* generic progress bar, shared by month cards and month view's pillar health */
.track{height:7px;background:var(--sunk);border-radius:4px;overflow:hidden}
.fill{height:100%;background:var(--d1)}
.monthcard{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px 16px;margin-bottom:8px}
.monthcard .row1{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px}
.monthcard .txt{font-size:13.5px;flex:1}
.monthcard .pl{font-family:"Manrope",sans-serif;font-size:9.5px;color:var(--muted);text-transform:uppercase;flex:none}
.monthcard .pct{font-family:"Manrope",sans-serif;font-size:10.5px;color:var(--muted);margin-top:4px;display:block}

/* month view's pillar-health bars */
.pbars{display:flex;flex-direction:column;gap:9px}
.pbar{display:grid;grid-template-columns:110px 1fr 40px;gap:10px;align-items:center;font-size:13px;color:var(--ink-2)}
.pbar .n{font-family:"Manrope",sans-serif;font-size:11px;color:var(--muted);text-align:right}

/* month view's calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-family:"Manrope",sans-serif;font-size:10px;color:var(--muted);text-align:center;padding:4px 0}
.cal .day{aspect-ratio:1;border-radius:7px;background:var(--sunk);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink-2)}
.cal .day.blank{background:none}
.cal .day.has{cursor:pointer;color:var(--ink);font-weight:500}
.cal .day.today{outline:2px solid var(--accent);outline-offset:-2px}

/* week view's redesigned hph-by-day chart */
.hphchart{position:relative;height:110px;display:flex;align-items:flex-end;gap:8px;padding-top:14px}
.hphchart .threshold{position:absolute;left:0;right:0;border-top:1px dashed var(--line-2)}
.hphchart .threshold span{position:absolute;right:0;top:-16px;font-family:"Manrope",sans-serif;font-size:9px;color:var(--muted);background:var(--ground);padding:0 4px}
.hbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;position:relative}
.hbar .val{font-family:"Manrope",sans-serif;font-size:10px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.hbar .col{width:100%;border-radius:3px 3px 0 0}
.hbar .col.filled{background:var(--d1)}
.hbar .col.empty{background:var(--sunk)}
.hbar .dow{font-family:"Manrope",sans-serif;font-size:10px;color:var(--muted)}
/* month view's weekly-HPH chart has a variable, often small, number of bars —
   without this a lone closed week stretches into one solid block instead of
   reading as a bar chart. Week's own day-by-day chart always has exactly 7
   bars, so it keeps the plain .hphchart's flex:1 full-width spread. */
.hphchart.compact{justify-content:flex-start}
.hphchart.compact .hbar{flex:0 0 60px}
.hbar.today .dow{color:var(--accent);font-weight:600}

/* week view's split business/vitality core-step tables */
.coretable{width:100%;border-collapse:collapse;font-size:10px}
.coretable th{padding:3px;color:var(--muted);font-weight:500;font-family:"Manrope",sans-serif}
.coretable td{padding:2px;text-align:center;color:var(--muted);font-family:"Manrope",sans-serif}
.coretable td.dow{text-align:left;padding-right:6px}

/* misc */
.empty{color:var(--muted);font-size:14px;padding:14px 0}
.pill{display:inline-block;font-family:"Manrope",sans-serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:5px;background:var(--raised);color:var(--ink-2)}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.no{background:var(--stop-soft);color:var(--stop)}
.savenote{font-family:"Manrope",sans-serif;font-size:11px;color:var(--muted)}
.savenote.warn{color:var(--stop);font-weight:600;background:var(--stop-soft);padding:6px 10px;border-radius:6px;display:inline-block}
.thinking{color:var(--muted);font-style:italic}
.t3row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.t3row input{flex:1}
.t3row select{width:140px;flex:none}
.t3row .rm{flex:none;border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;padding:0 4px}
.t3row .rm:hover{color:var(--stop)}
@media(max-width:560px){.t3row{flex-wrap:wrap}.t3row select{width:100%}}

/* task picker — "if there's time" / "plan tomorrow" */
.picker{display:flex;flex-direction:column;gap:12px}
.pickgroup{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--raised)}
.pickgroup h4{margin:0 0 6px;font-family:"Manrope",sans-serif;font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:6px;align-items:baseline}
.pickgroup h4 span{font-weight:400;text-transform:none;letter-spacing:0}
.pickrow{display:flex;gap:9px;align-items:center;padding:6px 0;border-top:1px solid var(--line);cursor:pointer}
.pickrow:first-of-type{border-top:0}
.pickrow input[type=checkbox]{width:16px;height:16px;flex:none;accent-color:var(--accent)}
.pickrow .tk{font-size:13.5px;flex:1}
.small{font-size:13px;line-height:1.45}
#olmodal .card{padding:10px 12px}
#olmodal select{width:auto;min-width:150px}
/* Morning picker (category lists) + journal pinned plan */
.pdot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block;background:var(--muted)}
.pdot[data-p=work]{background:#E06A3A}.pdot[data-p=career]{background:#17A2A2}.pdot[data-p=careerWork]{background:#E06A3A}.pdot[data-p=finances]{background:#3AAE78}.pdot[data-p=business]{background:#9A72DB}
.pdot[data-p=personal]{background:#D6982A}.pdot[data-p=vitality]{background:#E0578A}.pdot[data-p=relationships]{background:#3E95C8}.pdot[data-p=mindGrowth]{background:#6E9C3E}
.todaypin{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.todaypin .k{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin-bottom:4px}
.weekfocus{display:flex;gap:10px;align-items:baseline;font-size:14px;line-height:1.45;padding:8px 2px 10px;margin-bottom:4px}
.weekfocus .k{flex:none;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.fldnote{font-style:normal;font-weight:400;text-transform:none;letter-spacing:0;font-size:12px;color:var(--muted)}
.todaypin .it{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:3px 0}
.cat{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:8px}
.cat>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer}
.cat>summary::-webkit-details-marker{display:none}
.cat[open]>summary{border-bottom:1px solid var(--line)}
.cat .nm{font-weight:700;font-size:13.5px}
.cat .cnt{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted)}
.cat .body{padding:4px 8px 8px}
.catrow{display:flex;align-items:flex-start;gap:10px;padding:7px 4px;border-radius:7px;cursor:pointer}
.catrow:hover{background:var(--raised)}
.catrow input[type=checkbox]{width:17px;height:17px;flex:none;margin-top:2px;accent-color:var(--accent)}
.catrow .tk{flex:1;font-size:14px;line-height:1.35}
.catrow .due{font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap}
.catrow .drop{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;padding:0 4px;line-height:1;opacity:.55}
.catrow .drop:hover{opacity:1;color:var(--stop)}
/* ① Plan · ② How it's going · ③ Review (Week and Month) */
.stepper{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--sunk);border-radius:12px;padding:4px;margin:4px 0 22px}
.stepper button{border:0;background:none;border-radius:9px;padding:9px 6px;font:inherit;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer;line-height:1.25;text-align:center}
.stepper button small{display:block;font-size:11px;font-weight:500;margin-top:1px}
.stepper button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.stepper button.done{color:var(--good)}
.stepper button:not(.on):hover{color:var(--ink-2)}
.nudge{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:16px}
.nudgeact{display:flex;gap:14px}
.linkbtn{border:0;background:none;padding:0;font:inherit;font-weight:700;color:var(--accent);cursor:pointer}
.linkbtn.muted{color:var(--muted)}
.focuspin{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:14.5px;margin-bottom:16px;display:flex;gap:10px;align-items:baseline}
.focuspin .k{flex:none;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.sofar{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.sofar .lbl{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.sofar ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--ink-2)}
.moredetail{margin-top:22px;border-top:1px solid var(--line);padding-top:14px}
.moredetail > summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--muted)}
.planfields{display:flex;flex-direction:column;gap:10px}
.planfields label{display:block}
.planfields label b{color:var(--muted);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;display:block;margin-bottom:4px}
.planfields input,.planfields select{width:100%}
.tlsearch{display:block;width:100%;box-sizing:border-box;margin-bottom:12px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px}
.tasklist{display:flex;flex-direction:column;gap:12px}
.tlgroup{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 12px}
.tlsection > summary{list-style:none;cursor:pointer}
.tlsection > summary::-webkit-details-marker,.tlgroup > summary::-webkit-details-marker{display:none}
.tlsection > summary h2{display:flex;align-items:center;gap:8px;margin-bottom:0}
.tlsection > summary h2::after,.tlgroup > summary::after{content:"›";margin-left:auto;font-size:18px;line-height:1;color:var(--muted);transition:transform .15s}
.tlsection[open] > summary h2::after,.tlgroup[open] > summary::after{transform:rotate(90deg)}
.tlsection[open] > summary{margin-bottom:12px}
.tlsection > summary h2::after{font-size:20px;letter-spacing:0;color:var(--ink-2)}
.tlhead{display:flex;align-items:center;gap:8px;padding:6px 0;font-weight:700;font-size:14px;list-style:none;cursor:pointer}
.tlgroup[open] > .tlhead{padding-bottom:8px}
.tlhead .nm{flex:1}
.tlcount{font-size:12px;font-weight:600;color:var(--muted)}
.tlrow[hidden],.tlgroup[hidden]{display:none}
.tlrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.tlrow .tk{flex:1;font-size:14px;line-height:1.35;min-width:0}
.tlrow .tag{display:inline-block;font-size:10.5px;font-weight:600;color:var(--muted);background:var(--raised);border-radius:5px;padding:1px 6px;margin-left:4px;white-space:nowrap}
.tlrow .tag.late{color:var(--stop)}
.tlact{display:flex;gap:6px;align-items:center;flex:none}
.tlact select{width:auto;flex:none;font:inherit;font-size:12px;padding:3px 4px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.tlact button{white-space:nowrap;flex:none;font:inherit;font-size:12px;border-radius:6px;padding:4px 8px;cursor:pointer;background:none}
.tlact .tladd{border:1px solid var(--accent);color:var(--accent)}
.tlact .tldone{border:1px solid color-mix(in srgb,var(--good) 45%,transparent);color:var(--good)}
.tlact .tldrop{border:0;color:var(--muted);font-size:15px;padding:2px 4px}
.tlact .tldrop[data-armed="1"]{color:var(--stop);font-size:12px}
@media (max-width:560px){.tlrow{flex-wrap:wrap}.tlact{width:100%;justify-content:flex-end}}
.catrow .markdone{border:1px solid color-mix(in srgb,var(--good) 45%,transparent);background:none;color:var(--good);cursor:pointer;font-size:13px;line-height:1;padding:3px 7px;border-radius:6px;flex:none}
.catrow .markdone:hover{background:var(--good-soft)}
.catrow.isdone .tk{text-decoration:line-through;color:var(--muted)}
.catrow.isdone .markdone,.catrow.isdone .drop,.catrow.isdone .due{display:none}
.catrow .donenote{flex:none;font-size:12.5px;color:var(--good);display:flex;gap:6px;align-items:center}
.catrow .undodone{border:0;background:none;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:0;text-decoration:underline}
.catadd{display:flex;gap:6px;margin-top:4px}
.catadd input{flex:1;min-width:0;border-style:dashed}
.catadd .btn{flex:none}
.caterr{margin:6px 2px 0;font-size:12.5px;font-weight:600;color:var(--stop)}
.answers{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px;margin-top:10px;padding-top:10px;border-top:1px solid color-mix(in srgb,var(--accent) 25%,transparent)}
.answers dt{color:var(--ink-2);font-weight:700}
.answers dd{margin:0}
.prefill{background:var(--good-soft);border-radius:9px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.prefill b{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--good);margin-bottom:3px}
.glance{padding:4px 0}
.glrow{display:grid;grid-template-columns:auto auto 1fr;gap:4px 12px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 16px;font:inherit;color:var(--ink);cursor:pointer}
.glrow:first-child{border-top:0}
.glrow:disabled{cursor:default;opacity:.55}
.glrow:not(:disabled):hover{background:var(--raised)}
.glrow b{font-size:13.5px;min-width:34px}
.glmeta{font-size:12px;color:var(--muted);white-space:nowrap}
.glhl{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
@media (max-width:560px){.glrow{grid-template-columns:auto 1fr}.glhl{grid-column:1/-1;white-space:normal}}
.rv{display:flex;flex-direction:column;gap:12px}
.rvrow b{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.rvrow p{margin:0;font-size:14px;line-height:1.5}
.pickrow .pl{font-family:"Manrope",sans-serif;font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.banner{background:var(--accent-soft);border:1px solid var(--accent);color:var(--ink);padding:11px 14px;border-radius:9px;font-size:13.5px;margin-bottom:18px}
.banner.err{background:var(--stop-soft);border-color:var(--stop)}
/* modal */
.modalback{position:fixed;inset:0;background:rgba(8,12,14,.62);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surface);border:1px solid var(--line-2);border-radius:14px;padding:22px;max-width:480px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.35);max-height:90vh;overflow:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  .top,.seg,.btnrow,.composer,.nav-day{display:none!important}
  body{background:#fff;color:#000}
}

/* ── Learning tab (Phase H merge) ───────────────────────────
   Shares every token/component above; its own accent is green (Learning's
   established identity) instead of Life OS's orange, scoped to whatever
   renders inside .learning so the rest of the app is untouched. A couple
   of Learning's own class names collided with existing ones here (.seg,
   .note) and were renamed on the way in (.typeseg, .lnote) rather than
   resolved by CSS scoping tricks — simpler to read later. */
.learning .addnew{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 6px}
.learning .addnew .btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;font-weight:600;min-height:72px}
.learning .addnew .ic{font-size:20px;line-height:1}
.learning .yourtext{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.learning .yourtext summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.learning .yourtextbody{margin-top:8px;max-height:360px;overflow:auto;font-size:14px;line-height:1.55;color:var(--ink-2)}
.learning .yourtextbody p{margin:0 0 10px}
.learning{
  --accent:#1E5A43; --accent-soft:#DCEEE3; --on-accent:#FFFFFF; --d1:#174935; --head:#1E5A43;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .learning{
    --accent:#4FAE86; --accent-soft:#173226; --on-accent:#0D1712; --d1:#3C9070; --head:#4FAE86;
  }
}
:root[data-theme="dark"] .learning{
  --accent:#4FAE86; --accent-soft:#173226; --on-accent:#0D1712; --d1:#3C9070; --head:#4FAE86;
}

.sub{color:var(--muted);font-size:14px}
label:not(.fld):not(.pickrow):not(.catrow):not(.btn):not(.navya label):not(.actrow label){display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}
.kicker{font-size:13px;color:var(--muted);font-weight:600}
.row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
button.stat{font:inherit;color:inherit;text-align:left;width:100%}
.meta{font-size:13px;color:var(--muted);margin-top:2px}
.count{color:var(--muted);font-size:13px;font-weight:500}
/* Learning's h1/h2 have no wrapping .datehead/.blk the way Today/Week/Month's
   do, so they'd otherwise fall back to the browser default — give them the
   same treatment those already have, scoped to .learning so nothing else
   changes. */
.learning h1{font-family:"Literata",Georgia,serif;font-weight:500;font-size:clamp(26px,5vw,34px);line-height:1.15;margin:0;letter-spacing:-.01em}
.learning h2{font-family:"Manrope",sans-serif;font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--head);margin:24px 0 12px;padding-top:16px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.learning h2 .count{color:var(--ink-2);letter-spacing:.02em;font-weight:500;text-transform:none;font-size:13px}
.err{color:var(--stop);font-size:14px;margin-top:8px}
.sticky{position:sticky;bottom:0;background:var(--ground);padding:12px 0 calc(8px + env(safe-area-inset-bottom,0px));margin-top:18px;border-top:1px solid var(--line)}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-left:6px;padding-right:6px}
.btn.danger{color:var(--stop)}
.btn.back{margin:-6px 0 10px -6px}

.busy{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;padding:10px 0}
.busy .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.2s ease-in-out infinite;vertical-align:middle}
.pill.proc{background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;gap:6px}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer}
.li:first-child{border-top:0}
.li-title{font-size:15px;font-weight:600}
.book{cursor:pointer}
.book-title{font-family:"Literata",Georgia,serif;font-size:19px;font-weight:500;line-height:1.3}
.bar{height:4px;background:var(--sunk);border-radius:2px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:4px;background:var(--accent)}

.typeseg{display:flex;gap:6px;flex-wrap:wrap}
.typeseg button{flex:1 1 0}
.typeseg button[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

/* the book-page/screenshot reader — highlight color (--mark) is shared,
   not scoped to .learning, since it's just a highlighter-yellow concept
   that happens to only be used here right now */
.reader{font-family:"Literata",Georgia,serif;font-size:18px;line-height:1.8;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.reader p{margin:0 0 14px}
.pgno{font-family:"Manrope",sans-serif;font-size:12px;font-weight:700;color:var(--muted);margin:6px 0 8px}
.s{cursor:pointer;border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:2px 1px;margin:0 1px}
.s.hl{background:var(--mark);color:var(--mark-ink)}
.hint{font-size:13px;color:var(--ink-2);background:var(--accent-soft);border-radius:9px;padding:10px 14px;margin:0 0 14px}
.quote{font-family:"Literata",Georgia,serif;font-size:16px;line-height:1.6;margin:8px 0 0;padding:2px 0}
.lnote{margin-top:10px;font-size:15px}
.lnote b{font-size:12px;color:var(--muted);display:block;font-weight:700}
ul.ins{margin:6px 0 0;padding-left:18px;font-size:15px}
ul.ins li{margin:4px 0}

.block{border-radius:12px;padding:12px 14px;margin-top:12px}
.block-insights{background:var(--accent-soft)}
.block-actions{background:color-mix(in srgb,#E0A21B 13%,var(--surface));border-left:3px solid #E0A21B}
.block-thought{background:color-mix(in srgb,#8A5CD1 11%,var(--surface));border-left:3px solid #8A5CD1}
.block-thought .block-label{display:flex;align-items:center;justify-content:space-between;gap:8px}
.block-thought textarea,.block-thought input{width:100%}
.thoughtnote{font-size:14px;color:var(--ink-2);margin-top:6px}
.thoughtnote b{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.actionlist{display:flex;flex-direction:column}
.actionrow{display:flex;gap:6px;align-items:center;padding:7px 0;border-top:1px solid color-mix(in srgb,#E0A21B 25%,transparent);font-size:15px}
.actionrow:first-child{border-top:0}
.actionrow .tx{flex:1 1 auto;min-width:0}
.actionrow .tx:before{content:'✓ ';color:#B7800F;font-weight:700}
.actionrow small{display:block;font-size:12px;color:var(--muted)}
.iconact{border:0;background:none;color:var(--muted);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:4px 6px;border-radius:6px;flex:none}
.iconact:hover{background:var(--raised);color:var(--ink)}
.iconact.danger{font-size:17px;line-height:1}
.iconact.danger:hover{color:var(--stop)}
.actedit{padding:8px 0;border-top:1px solid color-mix(in srgb,#E0A21B 25%,transparent)}
.actedit input{width:100%;margin-bottom:6px}
.block-label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin:0 0 6px}
.block .sub{margin:0 0 8px}
.acts-list{display:flex;flex-direction:column;gap:0}
.actrow{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.actrow:first-child{border-top:0}
.actrow input[type=checkbox]{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.actrow label{display:block;font:inherit;color:var(--ink);margin:0;cursor:pointer;flex:1 1 auto}
.actrow small{display:block;color:var(--muted);font-size:12px}
.rm{background:none;border:0;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:2px 6px;flex:none}
.rm.danger{color:var(--stop);font-size:13px;font-weight:600}
.confirmedrow{display:flex;gap:8px;align-items:center;padding:6px 0;font-size:15px}
.confirmedrow:before{content:'✓';color:var(--accent);font-weight:700}
.block-brief{background:var(--surface);border:1px solid var(--line)}
.block-brief label:first-of-type{margin-top:0}
.reprow{display:flex;gap:8px;align-items:flex-start;margin-top:8px}
.reprow>div{flex:1 1 auto;display:flex;flex-direction:column;gap:6px}
.reprow>input{flex:1 1 auto}
.reprow .rm{flex:none;margin-top:6px}

.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:15px;cursor:pointer}
.chk:first-child{border-top:0}
.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.chk small{display:block;color:var(--muted);font-size:12px}

/* Learning's own numeric badge ("3 actions") — a rounded pill shape, kept
   distinct from the existing .pill above (a small uppercase status tag
   already used by Week/Month, e.g. .pill.ok/.pill.no) rather than
   overloading that class with a visually different meaning. */
.badge{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}

/* ── Navya tab ──────────────────────────────────────────────
   One deliberate look (dark, neon, "Gen Z"), chosen with Lokesh in the mockups. It doesn't follow
   the app's light/dark tokens on purpose: colours are set explicitly here and the page ground
   switches to the same dark while the tab is open. Chart series colours are the validated set
   for the #17122B panel. */
body.navya-mode{background:#0D0A1A;color-scheme:dark}
body.navya-mode .brand{color:#8F83B3}
body.navya-mode .seg{background:#17122B;border-color:#2E2552}
body.navya-mode .seg button{color:#C9BEE6}
body.navya-mode .seg button[aria-current="true"]{background:linear-gradient(135deg,#FF4FB8,#8B5CF6);color:#fff}
body.navya-mode #exportbtn,body.navya-mode #backupbtn,body.navya-mode #importbtn{display:none}
body.navya-mode .iconbtn{color:#C9BEE6;background:#17122B;border-color:#2E2552}
body.family .seg button:not([data-v="navya"]){display:none}
.navya{--bg:#0D0A1A;--panel:#17122B;--panel-2:#1F1838;--nline:#2E2552;--nink:#F6F1FF;--nink-2:#C9BEE6;--nmuted:#8F83B3;
  --pink:#FF4FB8;--violet:#8B5CF6;--cyan:#22D3EE;--lime:#B8FF3C;--amber:#FFC23D;--red:#FF6B6B;
  color:#F6F1FF;font-family:"DM Sans","Manrope",system-ui,sans-serif;font-size:15px;line-height:1.5;display:flex;flex-direction:column;gap:14px}
.navya h1,.navya h2,.navya h3,.navya h4{font-family:"Bricolage Grotesque","Manrope",system-ui,sans-serif;margin:0;text-wrap:balance;color:#F6F1FF;letter-spacing:0;text-transform:none;border:0;padding:0}
.navya h3{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.navya h4{font-size:14px;margin:12px 0 6px}
.navya p{margin:0 0 6px}
.navya a{color:var(--cyan)}
.navya .sub{color:var(--nmuted);font-size:12.5px}
.navya .mono{font-family:ui-monospace,monospace}
.navya table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.navya th{text-align:left;color:var(--nmuted);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:6px}
.navya td{padding:7px 6px;border-top:1px solid var(--nline);vertical-align:top;color:var(--nink-2)}
.navya td b{color:var(--nink)}
.navya .n{text-align:right}.navya .nw{white-space:nowrap}
.navya .tw{overflow-x:auto}
.navya input,.navya textarea{background:var(--panel-2);border:1px solid var(--nline);border-radius:10px;color:var(--nink);padding:8px 10px;font:inherit;width:100%}
.navya input[type=checkbox]{width:auto}
.navya button{font:inherit;cursor:pointer}
.navya button:focus-visible,.navya input:focus-visible,.navya textarea:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.nv-empty{color:var(--nmuted);padding:40px 0;text-align:center}
.nv-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.nv-hello h1{font-size:32px;font-weight:800;line-height:1.05}
.nv-hello h1 span{background:linear-gradient(135deg,#FF4FB8,#8B5CF6 50%,#22D3EE);-webkit-background-clip:text;background-clip:text;color:transparent}
.nv-hello p{color:var(--nink-2);margin:4px 0 0}
.nv-toggle{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--nline);border-radius:999px;padding:6px 8px 6px 14px;font-size:13px;font-weight:700;color:var(--nink-2)}
.nv-sw{width:44px;height:26px;border-radius:99px;background:var(--nline);position:relative;border:0;padding:0}
.nv-sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#F6F1FF;transition:transform .2s}
.nv-sw[aria-pressed="true"]{background:var(--pink)}.nv-sw[aria-pressed="true"]::after{transform:translateX(18px)}
.nv-kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--nmuted);font-weight:700}
.nv-link{border:0;background:none;color:var(--cyan);font-weight:700;font-size:13px;padding:0}
.nv-goals{background:linear-gradient(135deg,rgba(255,79,184,.13),rgba(139,92,246,.10) 50%,rgba(34,211,238,.10));border:1px solid rgba(255,79,184,.32);border-radius:22px;padding:14px}
.nv-goalshead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.nv-goalgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:900px){.nv-goalgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.nv-goalgrid{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}.nv-goal{flex:0 0 78%;scroll-snap-align:start}}
.nv-goal{background:rgba(13,10,26,.6);border:1px solid var(--nline);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.nv-goal .gh{font-size:12px;font-weight:700;color:var(--nink-2)}
.nv-goal b{font-family:"Bricolage Grotesque",sans-serif;font-size:16px;line-height:1.2}
.nv-goal .now{font-size:12.5px;color:var(--nink-2)}
.nv-goal.todo{border-style:dashed;background:transparent}
.navya .good{color:var(--lime)}.navya .warn{color:var(--amber)}.navya .bad{color:var(--red)}
.nv-meter{height:6px;border-radius:9px;background:var(--panel-2);overflow:hidden;margin-top:4px}
.nv-meter i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#FF4FB8,#8B5CF6,#22D3EE)}
.nv-dots{display:flex;gap:4px;margin-top:4px}.nv-dots i{width:12px;height:12px;border-radius:4px;background:var(--panel-2);border:1px solid var(--nline)}.nv-dots i.on{background:#B9A2FF;border-color:#B9A2FF}
.nv-limitline{margin:10px 0 0;font-size:13.5px;color:var(--nink-2)}
.nv-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
@media (min-width:900px){.nv-tabs{flex-wrap:wrap;overflow:visible}}
.nv-tabs button{flex:none;border:1px solid var(--nline);background:var(--panel);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13.5px;color:var(--nink-2)}
.nv-tabs button[aria-pressed="true"]{background:linear-gradient(135deg,#FF4FB8,#8B5CF6 50%,#22D3EE);border-color:transparent;color:#fff}
.nv-bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:900px){.nv-bento{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.nv-bento{grid-template-columns:minmax(0,1fr)}}
.nv-tile{background:var(--panel);border:1px solid var(--nline);border-radius:22px;padding:16px;min-width:0;grid-column:span 2}
.nv-tile.s4,.nv-cards.s4{grid-column:1/-1}
@media (max-width:560px){.nv-tile{grid-column:span 1}}
.nv-tile.glow{background:radial-gradient(260px 200px at 100% 0,rgba(255,79,184,.18),transparent 70%),var(--panel)}
.nv-tile.coach{background:linear-gradient(160deg,#241A45 0%,#17122B 60%);border-color:rgba(255,79,184,.35)}
.nv-tile.talk{background:linear-gradient(135deg,rgba(255,79,184,.16),rgba(34,211,238,.12));border-color:rgba(255,79,184,.35)}
.nv-tile.talk ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.nv-tile.parent{border-left:3px solid var(--amber)}
.navya.kid .parent-only{display:none}
.nv-headline{font-size:22px!important;font-weight:800;line-height:1.25;margin:8px 0 14px!important;max-width:44ch}
.nv-cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:900px){.nv-cols3{grid-template-columns:minmax(0,1fr)}}
.nv-cols3 ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--nink-2)}
.nv-cols3 p{font-size:14px;color:var(--nink-2)}
.nv-focus{margin-top:14px;border-radius:16px;padding:12px 14px;background:rgba(255,194,61,.10);border:1px solid rgba(255,194,61,.4);display:flex;flex-direction:column;gap:4px}
.nv-focus b{font-size:15.5px}
.nv-rowsplit{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.nv-chip{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--panel-2);color:var(--nink-2);white-space:nowrap}
.nv-chip.good{background:rgba(184,255,60,.15);color:var(--lime)}.nv-chip.warn{background:rgba(255,194,61,.16);color:var(--amber)}.nv-chip.bad{background:rgba(255,107,107,.16);color:var(--red)}
.nv-btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.nv-btn{border:1px solid var(--nline);border-radius:12px;padding:9px 14px;font-weight:800;background:var(--panel-2);color:var(--nink)}
.nv-btn.pri{background:linear-gradient(135deg,#FF4FB8,#8B5CF6);border-color:transparent;color:#fff}
.nv-btn.sm{padding:5px 10px;font-size:12.5px}
.nv-btn:disabled{opacity:.55;cursor:default}
.nv-x{border:0;background:none;color:var(--nmuted);font-size:16px;padding:0 4px}
.nv-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:560px){.nv-cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.nv-card{text-align:left;background:var(--panel);border:1px solid var(--nline);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:3px;min-width:0;color:var(--nink)}

.nv-card .ch{font-size:13px;font-weight:700;color:var(--nink-2)}
.nv-card b{font-family:"Bricolage Grotesque",sans-serif;font-size:20px;line-height:1.2;margin-top:4px}
.nv-card .dive{margin-top:auto;padding-top:8px;color:var(--cyan);font-weight:700;font-size:12.5px}
.nv-status{font-size:11.5px;font-weight:800}
.nv-status.ok{color:var(--lime)}.nv-status.watch{color:var(--amber)}.nv-status.work{color:var(--red)}.nv-status.new{color:#B9A2FF}
.nv-wins{display:flex;flex-wrap:wrap;gap:8px}
.nv-wins .sticker{background:var(--panel-2);border:1px dashed var(--nline);border-radius:14px;padding:7px 11px;font-size:13.5px;font-weight:700;transform:rotate(-1.2deg)}
.nv-wins .sticker:nth-child(2n){transform:rotate(1.2deg)}.nv-wins .sticker:nth-child(3n){background:rgba(139,92,246,.18)}
.nv-check,.nv-plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px;font-size:14px;color:var(--nink-2)}
.nv-plain b{color:var(--nink)}
.nv-todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.nv-todo li{display:flex;gap:10px;align-items:flex-start}
.nv-todo .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--nline);background:transparent;color:#0D0A1A;font-weight:800;flex:none;padding:0;font-size:12px}
.nv-todo .box.done{background:var(--lime);border-color:var(--lime)}
.nv-inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.nv-inline input{flex:1 1 160px;width:auto}
.nv-road{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;position:relative;margin-bottom:10px}
.nv-road::before{content:"";position:absolute;left:8px;right:calc(20% - 2px);top:11px;height:3px;background:var(--nline);border-radius:3px}
.nv-road .stop{position:relative;padding-top:26px;display:flex;flex-direction:column;gap:3px;min-width:0}
.nv-road .stop::before{content:"";position:absolute;top:4px;left:0;width:17px;height:17px;border-radius:50%;background:var(--panel);border:3px solid var(--nline)}
.nv-road .stop.now::before{background:var(--pink);border-color:#FFB3E1;box-shadow:0 0 0 5px rgba(255,79,184,.25)}
.nv-road .stop.end::before{background:var(--amber);border-color:var(--amber)}
.nv-road .yr{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--nmuted);font-weight:700}
.nv-road .stop.now .yr{color:var(--pink)}
.nv-road b{font-family:"Bricolage Grotesque",sans-serif;font-size:16px}
@media (max-width:720px){.nv-road{grid-template-columns:minmax(0,1fr);gap:14px;padding-left:28px}.nv-road::before{left:9px;right:auto;top:6px;bottom:60px;width:3px;height:auto}.nv-road .stop{padding-top:0}.nv-road .stop::before{left:-28px;top:2px}}
.nv-big3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:6px 0 12px}

.nv-big3 b{font-family:"Bricolage Grotesque",sans-serif;font-size:24px;line-height:1.15;font-variant-numeric:tabular-nums}
.nv-big3 span{font-size:12px;color:var(--nink-2)}
@media (max-width:560px){.nv-big3 b{font-size:19px}}

.nv-strip .val{text-align:right;font-weight:700}
.nv-axis{position:relative;height:16px;margin:4px 102px 6px 110px;font-size:11px;color:var(--nmuted)}

@media (max-width:560px){.nv-strip .srow{grid-template-columns:78px minmax(0,1fr) 80px}.nv-axis{margin:4px 90px 6px 88px}}
.nv-class h3{justify-content:space-between;align-items:baseline}
.nv-class p{font-size:13.5px;color:var(--nink-2)}
.nv-class p b{color:var(--nink)}
.nv-traits{display:flex;flex-direction:column;gap:9px}

.lvl{font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.lvl.l1{background:#2B2150;color:#B9A2FF}.lvl.l2{background:#4A35A0;color:#F6F1FF}.lvl.l3{background:#B9A2FF;color:#0D0A1A}
.nv-heat{display:grid;gap:5px;align-items:center;font-size:13px}
.nv-heat .hd{font-size:11px;color:var(--nmuted);text-align:center}
.nv-heat i{display:block;height:24px;border-radius:7px}
.navya .h0{background:var(--panel-2);border:1px dashed var(--nline)}.navya .h1{background:#2B2150}.navya .h2{background:#4A35A0}.navya .h3{background:#B9A2FF}
.nv-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--nink-2);margin-top:8px}

.nv-chart svg{width:100%;height:auto;display:block}
.nv-bars{display:flex;flex-direction:column;gap:8px}

.nv-bar .t{position:relative;height:14px;border-radius:5px;background:var(--panel-2)}
.nv-bar .t i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.nv-bar .t .lim{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1.5px;background:#F6F1FF;border-radius:2px}
.nv-bar .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.nv-bar .ax{position:relative;height:14px;font-size:11px;color:var(--nmuted)}
.nv-bar .ax span{position:absolute;transform:translateX(-50%)}.nv-bar .ax span:first-child{transform:none}

.nv-drop{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px dashed var(--violet);border-radius:18px;padding:22px 14px;text-align:center;background:rgba(139,92,246,.08);cursor:pointer}

.nv-drop .ic{font-size:30px}

.nv-drop .sub{font-weight:400}

.nv-thumbs .th{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--nline);aspect-ratio:4/3;max-width:100%}

.nv-changes{display:flex;flex-direction:column;gap:6px}
.nv-changes .chg{background:var(--panel-2);border-radius:12px;padding:8px 10px}
.nv-changes .pick{display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.nv-changes .flds{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 0 26px}
.nv-changes .flds label{display:flex;flex-direction:column;font-size:11px;color:var(--nmuted);gap:2px}
.nv-changes .flds input{width:110px;padding:5px 8px}
.nv-changes .flds label:has(input[data-k=title]){flex:1 1 240px}
.nv-changes .flds input[data-k=title]{width:100%}
.nv-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.nv-form .wide{grid-column:1/-1}
@media (max-width:720px){.nv-form{grid-template-columns:minmax(0,1fr)}}
.nv-form .lbl{font-size:12px;font-weight:700;color:var(--nink-2);margin-bottom:6px;display:block}
.nv-seg{display:flex;gap:6px;flex-wrap:wrap}
.nv-seg button{background:var(--panel-2);border:1px solid var(--nline);border-radius:12px;padding:7px 11px;font-size:13.5px;font-weight:700;color:var(--nink-2)}
.nv-seg button[aria-pressed="true"]{background:rgba(184,255,60,.16);border-color:var(--lime);color:var(--lime)}
.nv-fld{display:flex;flex-direction:column;gap:4px;margin-top:10px;font-size:12px;font-weight:700;color:var(--nink-2)}
.nv-fresh{color:var(--nmuted);font-size:12px;margin:4px 0 0}
</style>
</head>
<body>

<div class="wrap" id="wrap">
  <header class="top">
    <span class="brand">Life OS</span>
    <span class="spring"></span>
    <button class="btn sm" id="exportbtn" title="Copy the current day/week/month as formatted text for OneNote">Copy for OneNote</button>
    <button class="btn sm" id="backupbtn" title="Download a full JSON backup">Backup</button>
    <button class="btn sm" id="importbtn" title="Bulk-import tasks or journal entries">Import</button>
    <button class="iconbtn" id="settingsbtn" title="Settings">⚙</button>
    <nav class="seg" id="seg" aria-label="Views">
      <button data-v="today" aria-current="true">Today</button>
      <button data-v="week">Week</button>
      <button data-v="month">Month</button>
      <button data-v="learning">Learning</button>
      <button data-v="navya">Navya</button>
    </nav>
  </header>
  <main id="main"><p class="empty">Loading…</p></main>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
